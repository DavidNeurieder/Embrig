# Loopback test for the SocketCAN path. Sends one frame on the bus and
# requires it back on the same socket (own-message reception is enabled in
# `embrig-can`). It is the only example test that works on real hardware —
# the others use `set_signal`/`fault`, which are virtual-only.
name: bus_loopback
timeout: 5s
steps:
  - send: { id: 0x7FF, data: [1, 2, 3, 4, 5, 6, 7, 8] }
  - expect: { id: 0x7FF, present: true, within: 500ms }
