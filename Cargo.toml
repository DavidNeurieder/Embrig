[workspace]
resolver = "2"
members = [
    "crates/openhil-core",
    "crates/openhil-dbc",
    "crates/openhil-models",
    "crates/openhil-can",
    "crates/openhil-test",
    "crates/openhil-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/openhil/openhil"

[workspace.dependencies]
openhil-core = { path = "crates/openhil-core" }
openhil-dbc = { path = "crates/openhil-dbc" }
openhil-models = { path = "crates/openhil-models" }
openhil-can = { path = "crates/openhil-can" }
openhil-test = { path = "crates/openhil-test" }

serde = "1.0.229"
serde_json = "1.0"
serde-saphyr = "1.0.1"
thiserror = "2.0.19"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0.104"
socketcan = { version = "3.6.2", features = ["tokio"] }

[profile.release]
lto = true
