name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --features socketcan -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Test with socketcan feature
        run: cargo test --workspace --features socketcan

      - name: End-to-end example
        run: |
          cargo run -q --bin embrig -- test examples/ev-powertrain/vehicle.yaml

      - name: SIL example
        run: |
          cargo run -q --example sil_firmware --package embrig-sil

      - name: SIL robotics example
        run: |
          cargo run -q --example robot_sil --package embrig-sil

      - name: UDP rover example
        run: |
          cargo run -q --example udp_rover --package embrig-test

  socketcan-build:
    name: socketcan feature build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build with socketcan
        run: cargo build --workspace --features socketcan

      - name: Virtual tests still pass
        run: cargo run -q --features socketcan --bin embrig -- test examples/ev-powertrain/vehicle.yaml

  vcan-smoke:
    name: vcan0 socketcan smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: SocketCAN round trip on vcan0
        run: ./scripts/vcan-smoke.sh
