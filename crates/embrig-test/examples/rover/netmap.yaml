# Netmap for the rover Ethernet network.
#
# Each message is identified by its destination endpoint. Fields are named
# values at byte offsets within the payload; the simulation (and the test
# suites) key everything by message name.
messages:
  DriveCommand:
    dst: 192.168.1.30:5000
    length: 8
    fields:
      forward: { offset: 0, type: f32le }
      estop:   { offset: 4, type: bool }
  MotionState:
    dst: 192.168.1.10:5000
    length: 8
    fields:
      speed: { offset: 0, type: f32le }
      state:
        offset: 4
        type: u8
        values:
          0: STOPPED
          1: DRIVING
          2: EMERGENCY
