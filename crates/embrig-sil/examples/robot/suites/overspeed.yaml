# A command above the 1.5 m/s limit is refused (fail-safe).
name: overspeed_command_is_refused
timeout: 5s
steps:
  - wait: { time: 300ms }
  - set_signal: { ecu: joystick, id: 0x100, signal: speed, value: 5.0 }
  - expect: { id: 0x300, signal: state, equals: "FAULT", within: 1s }
  - expect: { id: 0x200, signal: left_speed, equals: 0.0, within: 1s }
