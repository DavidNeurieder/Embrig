# HIL twin of suites/resume.yaml: e-stop engage + release while commanding
# speed 1.0; the rover must halt then resume driving.
name: estop_release_resumes_driving
timeout: 5s
steps:
  - wait: { time: 300ms }
  - send: { id: 0x100, data: [0x64, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00] }
  - expect: { id: 0x300, signal: state, equals: "DRIVING", within: 1s }
  - send: { id: 0x110, data: [0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00] }
  - expect: { id: 0x300, signal: state, equals: "ESTOP", within: 1s }
  - send: { id: 0x110, data: [0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00] }
  - expect: { id: 0x300, signal: state, equals: "DRIVING", within: 1s }
  - expect: { id: 0x200, signal: right_speed, equals: 1.0, within: 1s }
