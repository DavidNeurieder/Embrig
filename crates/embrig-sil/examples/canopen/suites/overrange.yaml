# Above 90 °C the CANopen firmware closes the valve (fail-safe), reported on
# TPDO1 after the temperature is overridden on RPDO1.
name: overrange_temperature_closes_valve
timeout: 5s
steps:
  - wait: { time: 300ms }
  - set_signal: { ecu: master_rpdo, id: 0x201, signal: temperature, value: 150.0 }
  - expect: { id: 0x181, signal: valve_open, equals: false, within: 1s }
