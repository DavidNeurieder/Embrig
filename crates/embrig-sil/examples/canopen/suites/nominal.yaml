# NMT START brings the node to OPERATIONAL; a valid temperature (10..90 °C)
# opens the valve, reported on TPDO1.
name: valid_temperature_opens_valve
timeout: 5s
steps:
  - wait: { time: 300ms }
  - expect: { id: 0x181, signal: valve_open, equals: true, within: 1s }
  - expect: { id: 0x701, signal: state, equals: true, within: 1s }
